      </g>
  <g class="chip6">
        <rect x="684" y="134" width="59" height="28" rx="14" fill="#0d1117" stroke="#8b949e" stroke-width="1" stroke-opacity="0.55"/>
        <text x="713.5" y="148" fill="#f0f6fc" font-family="ui-monospace, monospace" font-size="13" letter-spacing="0.8" text-anchor="middle" dominant-baseline="middle">HTML</text>
      </g>
  <g class="chip7">
        <rect x="375" y="172" width="51" height="28" rx="14" fill="#0d1117" stroke="#8b949e" stroke-width="1" stroke-opacity="0.55"/>
