      </g>
  <g class="chip3">
        <rect x="366" y="134" width="83" height="28" rx="14" fill="#0d1117" stroke="#8b949e" stroke-width="1" stroke-opacity="0.55"/>
        <text x="407.5" y="148" fill="#f0f6fc" font-family="ui-monospace, monospace" font-size="13" letter-spacing="0.8" text-anchor="middle" dominant-baseline="middle">NEXT.JS</text>
      </g>
  <g class="chip4">
