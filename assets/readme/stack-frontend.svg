        <text x="110" y="148" fill="#f0f6fc" font-family="ui-monospace, monospace" font-size="13" letter-spacing="0.8" text-anchor="middle" dominant-baseline="middle">TYPESCRIPT</text>
      </g>
  <g class="chip1">
