<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Rafael Achtenberg, Full-Stack Software Engineer</title>
  <desc id="desc">A professional profile header showing a product flow from idea to delivery.</desc>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --line: #30363d;
      --grid: #21262d;
      --text: #f0f6fc;
      --muted: #8b949e;
      --accent: #58a6ff;
      --accent-soft: #1f3b5c;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #ffffff;
        --panel: #f6f8fa;
        --line: #d0d7de;
        --grid: #eaeef2;
        --text: #1f2328;
        --muted: #656d76;
        --accent: #0969da;
        --accent-soft: #ddf4ff;
      }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .label { fill: var(--muted); font-size: 14px; font-weight: 650; letter-spacing: 2.4px; }
    .name { fill: var(--text); font-size: 62px; font-weight: 720; letter-spacing: -2px; }
    .role { fill: var(--muted); font-size: 21px; font-weight: 500; }
    .panel-title { fill: var(--text); font-size: 14px; font-weight: 700; letter-spacing: 1.6px; }
    .node-title { fill: var(--text); font-size: 16px; font-weight: 650; }
    .node-subtitle { fill: var(--muted); font-size: 12px; font-weight: 500; }
  </style>

  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="var(--grid)" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--accent)"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1198" height="358" rx="22" fill="var(--bg)" stroke="var(--line)" stroke-width="2"/>
  <rect x="1" y="1" width="1198" height="358" rx="22" fill="url(#grid)" opacity="0.62"/>

  <rect x="58" y="48" width="4" height="264" rx="2" fill="var(--accent)"/>
  <text x="88" y="78" class="label">FULL-STACK SOFTWARE ENGINEER</text>
  <text x="84" y="163" class="name">Rafael</text>
  <text x="84" y="225" class="name">Achtenberg</text>
  <text x="88" y="276" class="role">Porto Alegre, Brazil</text>

  <g transform="translate(696 48)">
    <rect width="446" height="264" rx="16" fill="var(--panel)" stroke="var(--line)" stroke-width="1.5"/>
    <circle cx="24" cy="24" r="4" fill="var(--accent)"/>
    <circle cx="40" cy="24" r="4" fill="var(--line)"/>
    <circle cx="56" cy="24" r="4" fill="var(--line)"/>
    <text x="24" y="66" class="panel-title">IDEA TO DELIVERY</text>

    <path d="M118 119 H218" fill="none" stroke="var(--accent)" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M328 119 V184 H231" fill="none" stroke="var(--accent)" stroke-width="2" marker-end="url(#arrow)"/>

    <g transform="translate(24 92)">
      <rect width="94" height="54" rx="10" fill="var(--bg)" stroke="var(--line)"/>
      <circle cx="17" cy="18" r="5" fill="var(--accent)"/>
      <text x="30" y="22" class="node-title">Idea</text>
      <text x="17" y="41" class="node-subtitle">product need</text>
    </g>

    <g transform="translate(228 92)">
      <rect width="100" height="54" rx="10" fill="var(--bg)" stroke="var(--line)"/>
      <circle cx="17" cy="18" r="5" fill="var(--accent)"/>
      <text x="30" y="22" class="node-title">Build</text>
      <text x="17" y="41" class="node-subtitle">front + back</text>
    </g>

    <g transform="translate(131 158)">
      <rect width="100" height="54" rx="10" fill="var(--bg)" stroke="var(--line)"/>
      <circle cx="17" cy="18" r="5" fill="var(--accent)"/>
      <text x="30" y="22" class="node-title">Ship</text>
      <text x="17" y="41" class="node-subtitle">test + deploy</text>
    </g>

    <rect x="24" y="232" width="398" height="1" fill="var(--line)"/>
    <rect x="24" y="246" width="112" height="4" rx="2" fill="var(--accent-soft)"/>
    <rect x="144" y="246" width="72" height="4" rx="2" fill="var(--line)"/>
    <rect x="224" y="246" width="154" height="4" rx="2" fill="var(--line)"/>
  </g>
</svg>
